name: CD - Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/pace-wake
  VERSION: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🔑 Grant Execute Permission
      run: chmod +x gradlew

    - name: 🏗️ Build Application
      run: ./gradlew bootJar -x test --no-daemon

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: 🐳 Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
          ${{ env.DOCKER_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ env.VERSION }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'prod' }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔐 Configure SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: 🚀 Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USERNAME }}
        DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        VERSION: ${{ env.VERSION }}
      run: |
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << ENDSSH
          set -e
          
          echo "🔄 Pulling latest image..."
          docker pull ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
          
          echo "🛑 Stopping existing container..."
          docker stop pace-app || true
          docker rm pace-app || true
          
          echo "🚀 Starting new container..."
          docker run -d \
            --name pace-app \
            --restart unless-stopped \
            --network pace-network \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
            -e REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }} \
            -e KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }} \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
          
          echo "⏳ Waiting for health check..."
          sleep 30
          
          echo "✅ Health check..."
          curl -f http://localhost:8080/actuator/health || exit 1
          
          echo "🧹 Cleaning up old images..."
          docker image prune -f
          
          echo "✅ Deployment completed!"
        ENDSSH

    - name: 📢 Notify Slack on Success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '✅ PACE Wake 배포 성공! Version: ${{ env.VERSION }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: 📢 Notify Slack on Failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ PACE Wake 배포 실패! Version: ${{ env.VERSION }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
